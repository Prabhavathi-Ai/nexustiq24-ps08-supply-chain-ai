<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexusTiQ 24 | Disruption Investigation</title>
  <style>
    :root { --ink: #14211f; --muted: #61716d; --paper: #f5f7f2; --panel: #ffffff; --line: #d8e2dc; --accent: #0b6b62; --warn: #a85b18; --danger: #a83c35; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 16px/1.5 Georgia, serif; }
    header { padding: 28px max(24px, calc((100% - 1120px) / 2)); background: #173d39; color: #f7fbf5; }
    header p { margin: 4px 0 0; color: #c8ded5; font: 14px/1.4 Arial, sans-serif; letter-spacing: .04em; }
    main { max-width: 1120px; margin: 0 auto; padding: 36px 24px 64px; }
    .intro { max-width: 700px; margin-bottom: 28px; }
    h1, h2, h3 { margin: 0 0 10px; line-height: 1.15; }
    h1 { font-size: clamp(2rem, 5vw, 4rem); font-weight: 400; }
    h2 { font-size: 1.65rem; }
    h3 { font-size: 1rem; font-family: Arial, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .panel { background: var(--panel); border: 1px solid var(--line); padding: 24px; margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font: 700 14px Arial, sans-serif; }
    textarea { width: 100%; min-height: 130px; padding: 14px; resize: vertical; border: 1px solid #afc2b9; font: 17px/1.45 Georgia, serif; }
    button { border: 0; background: var(--accent); color: white; padding: 13px 20px; margin-top: 14px; font: 700 14px Arial, sans-serif; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .status { margin-top: 15px; font: 14px Arial, sans-serif; color: var(--muted); }
    .error { color: var(--danger); }
    .notice { border-left: 4px solid var(--accent); padding-left: 14px; margin: 18px 0; }
    .notice strong { display: block; font-family: Arial, sans-serif; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
    .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 18px 0; }
    .fact { background: #eef4ef; padding: 14px; }
    .fact small { display: block; color: var(--muted); font: 12px Arial, sans-serif; text-transform: uppercase; }
    .fact span { display: block; margin-top: 5px; font-weight: 700; }
    .records { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
    .record { border-top: 3px solid var(--accent); padding: 15px; background: #f8faf7; }
    .record p { margin: 5px 0; font-family: Arial, sans-serif; font-size: 14px; }
    .record .reason { color: var(--muted); }
    .banner { padding: 16px; margin-bottom: 18px; background: #fff3df; border-left: 4px solid var(--warn); font-family: Arial, sans-serif; }
    .banner.no-match { background: #fcebea; border-left-color: var(--danger); }
    .impact-group { margin-top: 24px; }
    .impact-group h3 { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
    .impact-item { border-left: 3px solid var(--accent); padding: 10px 14px; margin: 8px 0; background: #f8faf7; font-family: Arial, sans-serif; font-size: 14px; }
    .impact-item.unknown { border-left-color: var(--warn); }
    .priority-list { display: grid; gap: 12px; margin-top: 14px; }
    .priority-order { border-left: 5px solid var(--accent); padding: 14px 16px; background: #eef4ef; font-family: Arial, sans-serif; }
    .priority-order:first-child { border-left-color: #b56b18; background: #fff3df; }
    .priority-meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .action-option { border-top: 3px solid var(--accent); padding: 14px 16px; margin: 12px 0; background: #f8faf7; font-family: Arial, sans-serif; }
    .action-option.recommended { border-top-color: #b56b18; background: #fff3df; }
    .action-option p { margin: 7px 0; }
    @media (max-width: 600px) { main { padding: 24px 16px 48px; } header { padding: 22px 16px; } .panel { padding: 18px; } }
  </style>
</head>
<body>
  <header><strong>NEXUSTIQ 24 / PS08</strong><p>DISRUPTION INVESTIGATION</p></header>
  <main>
    <section class="intro"><h1>Report a disruption</h1><p>Capture the operator's notice, review what was understood, and inspect the supply-chain records that may be relevant.</p></section>
    <section class="panel">
      <label for="description">Disruption notice</label>
      <textarea id="description" placeholder="Example: Limited Components reported a production halt near Vellore. Road transport may be delayed."></textarea>
      <button id="analyze" type="button">Analyze disruption</button>
      <div id="status" class="status" role="status"></div>
    </section>
    <section id="result" hidden></section>
  </main>
  <script>
    const description = document.getElementById('description');
    const analyze = document.getElementById('analyze');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const list = values => values && values.length ? values.map(escapeHtml).join(', ') : 'Not stated';
    const request = async (url, options) => { const response = await fetch(url, options); const body = await response.json(); if (!response.ok) throw new Error(body.detail || 'Request failed'); return body; };
    const renderCandidates = (title, candidates) => candidates.map(candidate => `<article class="record"><h3>${escapeHtml(title)}</h3><strong>${escapeHtml(candidate.entity_name)}</strong><p>${escapeHtml(candidate.entity_id)}</p><p class="reason"><b>Why:</b> ${escapeHtml(candidate.match_reason)}</p></article>`).join('');
    analyze.addEventListener('click', async () => {
      const text = description.value;
      result.hidden = true; status.className = 'status';
      if (!text.trim()) { status.textContent = 'Enter a disruption notice before analyzing.'; status.className += ' error'; return; }
      analyze.disabled = true; status.textContent = 'Accepting notice...';
      try {
        const disruption = await request('/api/disruptions', { method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({description: text}) });
        status.textContent = 'Understanding notice...';
        const understood = await request(`/api/disruptions/${disruption.disruption_id}/understanding`, {method:'POST'});
        status.textContent = 'Matching supply-chain records...';
        const matches = await request(`/api/disruptions/${disruption.disruption_id}/matches`, {method:'POST'});
        status.textContent = 'Tracing operational relationships...';
        const impact = await request(`/api/disruptions/${disruption.disruption_id}/impact`, {method:'POST'});
        status.textContent = 'Prioritizing affected orders...';
        const priorities = await request(`/api/disruptions/${disruption.disruption_id}/priorities`, {method:'POST'});
        status.textContent = 'Preparing action options...';
        const actionPlan = await request(`/api/disruptions/${disruption.disruption_id}/recommendations`, {method:'POST'});
        status.textContent = 'Calculating operational analytics...';
        const analytics = await request(`/api/disruptions/${disruption.disruption_id}/analytics`, {method:'POST'});
        const facts = understood.understanding;
        const cards = [...matches.suppliers.map(x => ['Supplier', x]), ...matches.shipments.map(x => ['Shipment', x]), ...matches.containers.map(x => ['Container', x]), ...matches.routes.map(x => ['Route', x]), ...matches.skus.map(x => ['SKU', x])];
        const evidenceRefs = refs => refs && refs.length ? `<small class="priority-meta">Evidence: ${refs.map(ref => `${escapeHtml(ref.evidence_id)} (${escapeHtml(ref.entity_type)} ${escapeHtml(ref.record_id)}.${escapeHtml(ref.field)} = ${escapeHtml(ref.value)})`).join(' | ')}</small>` : '';
        const impactItems = records => records.map(item => `<div class="impact-item ${escapeHtml(item.classification)}"><strong>${escapeHtml(item.entity_type)}: ${escapeHtml(item.entity_name)}</strong><br>${escapeHtml(item.reason)}<br><small>Source: ${escapeHtml(item.source_record)} | Fact: ${escapeHtml(item.supporting_fact)}</small>${evidenceRefs(item.evidence_references)}</div>`).join('');
        const impactPanel = `<div class="impact-group"><h2>Operational impact</h2><div class="notice"><strong>Impact state</strong>${escapeHtml(impact.impact_state.replaceAll('_', ' '))}</div>${impact.direct_impact.length ? `<h3>Direct impact</h3>${impactItems(impact.direct_impact)}` : ''}${impact.downstream_potential_impact.length ? `<h3>Downstream potential impact</h3>${impactItems(impact.downstream_potential_impact)}` : ''}${impact.impact_state === 'review_required' ? '<div class="banner">Review required: multiple possible matches were retained.</div>' : ''}${impact.insufficient_information.length ? `<h3>Insufficient information</h3>${impactItems(impact.insufficient_information)}` : ''}${impact.impact_state === 'no_impact' ? '<div class="banner no-match">No supply-chain impact could be established from the available records.</div>' : ''}</div>`;
        const priorityBreakdown = Object.entries(analytics.orders.priority_counts || {}).map(([key, value]) => `${escapeHtml(key)}: ${value}`).join(' | ') || 'None';
        const classificationBreakdown = Object.entries(analytics.investigation.impact_classification_counts || {}).map(([key, value]) => `${escapeHtml(key)}: ${value}`).join(' | ') || 'None';
        const affectedTrace = analytics.investigation.affected_order_count > 0 ? `<p class="data-note">Affected orders: ${list(analytics.investigation.affected_order_ids)} · Shipments: ${list(analytics.investigation.affected_shipment_ids)} · Customers: ${list(analytics.investigation.affected_customer_ids)}</p>` : '<div class="banner no-match">No affected records were established for this investigation.</div>';
        const analyticsPanel = `<div class="impact-group"><h2>Operational Analytics</h2><div class="summary-grid">${[
          ['Active orders', analytics.orders.total_active_orders],
          ['Ordered quantity', analytics.orders.total_ordered_quantity],
          ['Available inventory', analytics.inventory.total_available_quantity ?? '\u2013'],
          ['Affected orders', analytics.investigation.affected_order_count],
          ['Affected customers', analytics.investigation.affected_customer_count],
          ['Shortage quantity', analytics.investigation.affected_orders_shortage_quantity ?? '\u2013'],
        ].map(([label, value]) => `<div class="summary-card"><small>${label}</small><strong>${escapeHtml(value)}</strong></div>`).join('')}</div><p><b>Order priority:</b> ${priorityBreakdown}</p><p><b>Impact classification:</b> ${classificationBreakdown}</p>${affectedTrace}<p class="data-note">Order avg ${analytics.orders.average_order_quantity ?? 'n/a'} / median ${analytics.orders.median_order_quantity ?? 'n/a'} · Inventory avg per SKU ${analytics.inventory.average_inventory_per_sku ?? 'n/a'} / median ${analytics.inventory.median_inventory_per_sku ?? 'n/a'}${analytics.inventory.shortage_incomplete ? ' · dataset shortage incomplete' : ''}. Every figure traces to committed records or this investigation's matched records.</p>${analytics.warnings.map(warning => `<div class="banner">${escapeHtml(warning)}</div>`).join('')}</div>`;
        const priorityItems = priorities.orders.map((order, index) => `<article class="priority-order"><strong>#${index + 1} ${escapeHtml(order.order_id)} - ${escapeHtml(order.customer_name)}</strong><div class="priority-meta">Score ${order.priority_score} | ${escapeHtml(order.urgency)} urgency | ${escapeHtml(order.severity)} severity | SKU ${escapeHtml(order.affected_sku)}</div><div class="priority-meta">Shipments: ${list(order.shipment_ids)} | Routes: ${list(order.route_ids)} | Containers: ${list(order.container_ids)}</div>${order.inventory_shortage ? `<div class="priority-meta">Inventory ${order.inventory_shortage.available_quantity} / order ${order.inventory_shortage.order_quantity} / shortage ${order.inventory_shortage.shortage_quantity}</div>` : ''}<p>${order.reasons.map(escapeHtml).join(' ')}</p><small>${order.evidence.map(escapeHtml).join(' ')}</small>${evidenceRefs(order.evidence_references)}</article>`).join('');
        const priorityPanel = `<div class="impact-group"><h2>Priority orders</h2><div class="notice"><strong>Priority state</strong>${escapeHtml(priorities.overall_state.replaceAll('_', ' '))}</div>${priorities.orders.length ? `<div class="priority-list">${priorityItems}</div>` : '<div class="banner no-match">No affected orders were identified.</div>'}${priorities.insufficient_information.length ? `<div class="banner">Insufficient information: ${list(priorities.insufficient_information)}</div>` : ''}</div>`;
        const optionItems = actionPlan.options.map(option => `<article class="action-option ${option.option_id === actionPlan.recommended_option_id ? 'recommended' : ''}"><strong>${escapeHtml(option.name)}</strong><p>${escapeHtml(option.description)}</p><p><b>Suitability:</b> ${escapeHtml(option.suitability)}</p><p><b>Trade-offs:</b> ${list(option.trade_offs)}</p><p><b>Risks:</b> ${list(option.risks)}</p><p><b>Prerequisites:</b> ${list(option.prerequisites)}</p><p><b>Evidence:</b> ${list(option.evidence)}</p>${evidenceRefs(option.evidence_references)}</article>`).join('');
        const actionPanel = `<div class="impact-group"><h2>Action plan</h2><div class="notice"><strong>Recommended course</strong>${escapeHtml(actionPlan.recommended_course)}</div><p><b>Why:</b> ${list(actionPlan.why)}</p>${actionPlan.options.length ? `<h3>Options</h3>${optionItems}` : '<div class="banner no-match">No action recommendation is made because no operational impact was established.</div>'}<div class="banner">${escapeHtml(actionPlan.operator_decision_required)}</div>${actionPlan.warnings.length ? `<p class="priority-meta">${list(actionPlan.warnings)}</p>` : ''}</div>`;
        result.innerHTML = `<div class="panel"><h2>Disruption understood</h2><div class="notice"><strong>Original notice</strong>${escapeHtml(disruption.original_description)}</div><div class="facts"><div class="fact"><small>Event</small><span>${escapeHtml(facts.event_type || 'Not stated')}</span></div><div class="fact"><small>Locations</small><span>${list(facts.locations)}</span></div><div class="fact"><small>Duration</small><span>${escapeHtml(facts.duration_text || 'Not stated')}</span></div><div class="fact"><small>Transport</small><span>${escapeHtml(facts.transport_mode || 'Not stated')}</span></div></div>${facts.uncertainties.length ? `<div class="banner">Uncertainty: ${list(facts.uncertainties)}</div>` : ''}<h2>Potentially affected records</h2>${matches.match_status === 'no_match' ? '<div class="banner no-match">No matching supply-chain records found.</div>' : ''}${matches.match_status === 'ambiguous' ? '<div class="banner">Multiple possible matches found - review required.</div>' : ''}<div class="records">${cards.map(([title, card]) => renderCandidates(title, [card])).join('')}</div>${matches.evidence.length ? `<h2>Evidence</h2><ul>${matches.evidence.map(escapeHtml).map(item => `<li>${item}</li>`).join('')}</ul>` : ''}</div>`;
        result.insertAdjacentHTML('beforeend', impactPanel);
        result.insertAdjacentHTML('beforeend', analyticsPanel);
        result.insertAdjacentHTML('beforeend', priorityPanel);
        result.insertAdjacentHTML('beforeend', actionPanel);
        result.hidden = false; status.textContent = 'Investigation ready for review.';
      } catch (error) { status.textContent = error.message || 'The investigation could not be completed.'; status.className += ' error'; }
      finally { analyze.disabled = false; }
    });
  </script>
</body>
</html>
